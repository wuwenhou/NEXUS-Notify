[workspace]
resolver = "2"

members = [
    "nexus-domain",
    "nexus-policy",
    "nexus-oem-xiaomi",
    "nexus-fcm",
    "nexus-automation",
    "nexus-recovery",
    "nexus-audit",
    "nexus-storage",
    "nexus-core",
    "nexus-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NEXUS Notify contributors"]
license = "Apache-2.0"
repository = "https://github.com/omijia/nexus-notify"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
uniffi = "0.28"